services:
  teamspeak-web:
    build: .
    image: teamspeak-web:latest
    container_name: teamspeak-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - PROTOCOL=ts3
    volumes:
      - tsweb-data:/app/gateway/data

volumes:
  tsweb-data:
