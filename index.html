<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>TeamSpeak Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // If the module script never mounts React, show how to start the app.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.childElementCount === 0 && !root.textContent) {
            root.innerHTML =
              '<div style="padding:24px;color:#1d1d1f;background:#f5f5f7;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;SF Pro Display&quot;,&quot;Helvetica Neue&quot;,&quot;PingFang SC&quot;,system-ui,sans-serif">' +
              '<h1 style="font-size:18px;margin:0 0 12px">TeamSpeak Web 未启动</h1>' +
              '<p style="color:#7a7a7f;font-size:14px;line-height:1.6">这是 Vite 入口页，不能直接以 file:// 打开。请在项目目录执行：</p>' +
              '<pre style="background:#ffffff;border:1px solid rgba(15,20,30,0.08);padding:12px;border-radius:8px;color:#2e9e5b">npm run build\nnpm start</pre>' +
              '<p style="color:#7a7a7f;font-size:14px">然后打开 <a href="http://127.0.0.1:8080" style="color:#0066cc">http://127.0.0.1:8080</a></p>' +
              '</div>'
          }
        }, 1200)
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
